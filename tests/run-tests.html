<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tests - SAFe Timekeeper</title>
    <style>
      body { max-width: 960px; margin: 32px auto; padding: 0 20px; font-family: sans-serif; color: #003b5c; background: #eef5f8; }
      h1 { margin-bottom: 8px; }
      #summary { margin: 20px 0; padding: 16px; border-radius: 6px; background: #ffffff; font-weight: 700; }
      #summary.pass { border-left: 6px solid #007a78; }
      #summary.fail { border-left: 6px solid #b42318; }
      #results { display: grid; gap: 8px; padding: 0; list-style: none; }
      #results li { padding: 12px 16px; border-radius: 4px; background: #ffffff; }
      #results .pass { border-left: 4px solid #007a78; }
      #results .fail { border-left: 4px solid #b42318; }
      .error { display: block; margin-top: 6px; color: #8f1d16; font-family: monospace; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <h1>Tests SAFe Timekeeper</h1>
    <p>Tests unitaires et d'intégration des modules métier. Aucun projet sauvegardé n'est modifié.</p>
    <div id="summary" aria-live="polite">Exécution des tests...</div>
    <ul id="results"></ul>
    <script type="module" src="./run-tests.js"></script>
  </body>
</html>
